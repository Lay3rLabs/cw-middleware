[package]
name = "wavs-counter-handler"
authors = ["Noah Saso <noah@layer.xyz>"]
description = "A simple service handler that counts the number of times a service has been called by WAVS."
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

cw-wavs-types = { workspace = true }
cw-wavs-types-macros = { workspace = true }

[dev-dependencies]
cw-multi-test = { workspace = true }
