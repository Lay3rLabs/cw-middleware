[workspace]
members = [
  "packages/sdk",
  "packages/utils",
  "packages/contracts/mock/api",
  "packages/contracts/mock/service-handler",
  "packages/contracts/mock/service-manager",
  "packages/contracts/trigger/api",
  "packages/contracts/trigger/simple",
  "packages/contracts/ecdsa/api",
  "packages/contracts/ecdsa/service-handler",
  "packages/contracts/ecdsa/service-manager",
  "packages/contracts/bls/api",
  "packages/contracts/bls/service-handler",
  "packages/contracts/bls/service-manager",
  "packages/contracts/mirror/api",
  "packages/contracts/mirror/service-handler",
  "packages/contracts/mirror/service-manager",
  "packages/contracts/mirror/stake-registry",
  "packages/components/echo-with-id",
  "packages/components/simple-aggregator",
  "packages/tests/off-chain",
  "packages/tests/on-chain",
  "packages/tests/shared",
  "packages/cli",
]

resolver = "2"

[workspace.package]
edition = "2021"
version = "0.5.3"
license = "GPL-3.0-or-later"
authors = ["Layer Labs (Cayman)"]
repository = "https://github.com/Lay3rLabs/cw-middleware"
rust-version = "1.88.0"

[workspace.dependencies]
# Local
cw-wavs-sdk = { path = "packages/sdk" }
cw-wavs-mock-api = { path = "packages/contracts/mock/api" }
cw-wavs-ecdsa-api = { path = "packages/contracts/ecdsa/api" }
cw-wavs-bls-api = { path = "packages/contracts/bls/api" }
cw-wavs-trigger-api = { path = "packages/contracts/trigger/api" }
cw-wavs-mirror-api = { path = "packages/contracts/mirror/api" }
cw-wavs-mirror-service-handler = { path = "packages/contracts/mirror/service-handler" }
cw-wavs-mirror-service-manager = { path = "packages/contracts/mirror/service-manager" }
cw-wavs-mock-service-handler = { path = "packages/contracts/mock/service-handler" }
cw-wavs-mock-service-manager = { path = "packages/contracts/mock/service-manager" }
cw-wavs-trigger-simple = { path = "packages/contracts/trigger/simple" }
cw-wavs-ecdsa-service-handler = { path = "packages/contracts/ecdsa/service-handler" }
cw-wavs-ecdsa-service-manager = { path = "packages/contracts/ecdsa/service-manager" }
cw-wavs-bls-service-handler = { path = "packages/contracts/bls/service-handler" }
cw-wavs-bls-service-manager = { path = "packages/contracts/bls/service-manager" }
cw-wavs-mirror-stake-registry = { path = "packages/contracts/mirror/stake-registry" }
utils = { path = "packages/utils" }
shared-tests = { path = "packages/tests/shared" }

# WAVS
wavs-types = { version = "=2.0.0-alpha.4", default-features = false, features = [
  "cosmwasm",
] }
wavs-types-full = { package = "wavs-types", version = "=2.0.0-alpha.4", features = [
  "full",
] }
wavs-wasi-utils = "0.5.1"

# Error handling
anyhow = "1.0.98"
thiserror = "2.0.12"

# Async
tokio = { version = "1.47.1", features = ["full"] }
async-trait = "0.1.88"
futures = "0.3.31"

# http
reqwest = { version = "0.12", features = ["json"] }

# pool management
deadpool = "0.12.2"

# hashing / cipher
sha2 = "0.10.9"
const-hex = "1.14.1"
ripemd = "0.1.3"
rustls = { version = "0.23.31", features = ["aws-lc-rs"] }
ed25519-zebra = { version = "4.1.0", default-features = false, features = [
  "alloc",
] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
toml = "0.9.5"
serde_json = "1.0.142"

# Layer-climb
layer-climb = "0.8.3"
layer-climb-core = "0.8.3"
layer-climb-address = { version = "0.8.3", features = [
  "cw-storage",
  "openapi",
] }
layer-climb-config = "0.8.3"
layer-climb-cli = "0.8.3"

# Cosmos-specific dependencies
cosmwasm-schema = "3.0.2"
cosmwasm-std = { version = "=3.0.2", features = ["cosmwasm_1_2"] }
cw-storage-plus = "3.0.1"
cw2 = "3.0.0"
cw-multi-test = { version = "3.0.1", features = [
  "staking",
  "stargate",
  "cosmwasm_1_2",
] }

# WASI
wstd = "0.5.3"
wit-bindgen-rt = "0.43.0"

# CLI
clap = { version = "4.5.44", features = ["derive", "env", "string"] }
dotenvy = "0.15.7"

# Randomness
rand = { version = "0.9.2" }


# Alloy
alloy-primitives = { version = "1.3.0" }
alloy-sol-macro = "1.3.0"
alloy-sol-types = "1.3.0"
alloy-signer = "1.0.28"


# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[patch.crates-io]
# see https://github.com/CosmWasm/cosmwasm/issues/2525
cosmwasm-crypto = { git = "https://github.com/CosmWasm/cosmwasm", rev = "72d4eb09260d1773262d9a1cd7bdbb0f17abe7ab" }
