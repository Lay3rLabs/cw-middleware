version: "3"

tasks:
  generate-env:
    vars:
      OPERATOR_COUNT: 3
    cmds:
      - cd packages/cli && cargo run generate-env {{.OPERATOR_COUNT}} --wavs-home {{.WAVS_HOME_DIR}}

  tap-faucet:
    vars:
      OPERATOR_COUNT: 3
    cmds:
      - cd packages/cli && cargo run faucet-tap --wavs-home {{.WAVS_HOME_DIR}} {{.CLI_ARGS}}

  service-manager-upload:
    vars:
      CONTRACT_KIND:
        sh: task contracts:env-kind
    cmds:
      - cd packages/cli && cargo run service-manager upload --wavs-home {{.WAVS_HOME_DIR}} --wasm-directory {{.CONTRACTS_ARTIFACTS_PATH}} --contract-kind {{.CONTRACT_KIND}}

  service-manager-instantiate:
    vars:
      CONTRACT_KIND:
        sh: task contracts:env-kind
    requires:
      vars: [CODE_ID]
    cmds:
      - cd packages/cli && cargo run service-manager instantiate-{{.CONTRACT_KIND}} --wavs-home {{.WAVS_HOME_DIR}} --code-id {{.CODE_ID}}

  service-handler-upload:
    vars:
      CONTRACT_KIND:
        sh: task contracts:env-kind
    cmds:
      - cd packages/cli && cargo run service-handler upload --wavs-home {{.WAVS_HOME_DIR}} --wasm-directory {{.CONTRACTS_ARTIFACTS_PATH}} --contract-kind {{.CONTRACT_KIND}}

  service-handler-instantiate:
    requires:
      vars: [CODE_ID, SERVICE_MANAGER_ADDR]
    vars:
      CONTRACT_KIND:
        sh: task contracts:env-kind
    cmds:
      - cd packages/cli && cargo run service-handler instantiate-{{.CONTRACT_KIND}} --wavs-home {{.WAVS_HOME_DIR}} --code-id {{.CODE_ID}} --service-manager {{.SERVICE_MANAGER_ADDR}}

  service-manager-set-service-uri:
    requires:
      vars: [ADDR, URI]
    cmds:
      - cd packages/cli && cargo run service-manager set-service-uri --wavs-home {{.WAVS_HOME_DIR}} --address {{.ADDR}} --uri {{.URI}}

  service-manager-get-service-uri:
    requires:
      vars: [ADDR]
    cmds:
      - cd packages/cli && cargo run service-manager get-service-uri --wavs-home {{.WAVS_HOME_DIR}} --address {{.ADDR}}

  service-handler-get-manager:
    requires:
      vars: [ADDR]
    cmds:
      - cd packages/cli && cargo run service-handler get-manager --wavs-home {{.WAVS_HOME_DIR}} --address {{.ADDR}}
