version: "3"

tasks:
  generate-env:
    vars:
      OPERATOR_COUNT: 3
    cmds:
      - cd packages/cli && cargo run generate-env {{.OPERATOR_COUNT}}

  tap-faucet:
    vars:
      OPERATOR_COUNT: 3
    cmds:
      - cd packages/cli && cargo run faucet-tap {{.CLI_ARGS}}

  service-manager-upload:
    cmds:
      - task: contract-upload-inner
        vars:
          NAME: "service_manager"

  service-handler-upload:
    cmds:
      - task: contract-upload-inner
        vars:
          NAME: "service_handler"

  contract-upload-inner:
    internal: true
    requires:
      vars: [NAME]
    vars:
      CONTRACT_KIND:
        sh: task contracts:env-kind
      CONTRACT_NAME: "cw_wavs_{{.CONTRACT_KIND}}_{{.NAME}}.wasm"
      CONTRACT_PATH: "{{.CONTRACTS_ARTIFACTS_PATH}}/{{.CONTRACT_NAME}}"
    cmds:
      - cd packages/cli && cargo run contract upload --wasm-file "{{.CONTRACT_PATH}}"

  service-manager-deploy:
    vars:
      CONTRACT_KIND:
        sh: task contracts:env-kind
    requires:
      vars: [CODE_ID]
    cmds:
      - cd packages/cli && cargo run service-manager deploy --code-id {{.CODE_ID}} --contract-kind {{.CONTRACT_KIND}}

  service-handler-deploy:
    requires:
      vars: [CODE_ID, SERVICE_MANAGER_ADDR]
    vars:
      CONTRACT_KIND:
        sh: task contracts:env-kind
    cmds:
      - cd packages/cli && cargo run service-handler deploy --code-id {{.CODE_ID}} --service-manager {{.SERVICE_MANAGER_ADDR}} --contract-kind {{.CONTRACT_KIND}}

  service-manager-set-service-uri:
    requires:
      vars: [ADDR, URI]
    cmds:
      - cd packages/cli && cargo run service-manager set-service-uri --address {{.ADDR}} --uri {{.URI}}

  service-manager-get-service-uri:
    requires:
      vars: [ADDR]
    cmds:
      - cd packages/cli && cargo run service-manager get-service-uri --address {{.ADDR}}

  service-handler-get-manager:
    requires:
      vars: [ADDR]
    cmds:
      - cd packages/cli && cargo run service-handler get-manager --address {{.ADDR}}
