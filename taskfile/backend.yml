version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true
  docker:
    taskfile: ./docker.yml
    flatten: true

tasks:
  start-all:
    deps: [start-wavs, start-chains]

  start-wavs:
    cmds: 
      - echo "hello world"

  start-chains:
    cmds:
      - starship start --config "{{.STARSHIP_CHAIN_FILE}}"

  stop-chains:
    cmds:
      - starship stop --config "{{.STARSHIP_CHAIN_FILE}}"