version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

tasks:
  build-all:
    cmds:
      - for: { var: ALL_COMPONENTS }
        cmd: task components:build-{{.ITEM}}

  bindings-all:
    cmds:
      - for: { var: ALL_COMPONENTS }
        cmd: task components:bindings-{{.ITEM}}

  build-echo-with-id:
    - task: build-component-inner
      vars:
        NAME: "echo_with_id"
        SRC: "echo-with-id"

  bindings-echo-with-id:
    - task: bindings-component-inner
      vars:
        SRC: "echo-with-id"

  exec-echo-with-id:
    - task: exec-component-inner
      vars:
        NAME: "echo_with_id"

  build-simple-aggregator:
    - task: build-component-inner
      vars:
        NAME: "simple_aggregator"
        SRC: "simple-aggregator"

  bindings-simple-aggregator:
    - task: bindings-component-inner
      vars:
        SRC: "simple-aggregator"

  exec-simple-aggregator:
    - task: exec-component-inner
      vars:
        NAME: "simple_aggregator"

  build-component-inner:
    internal: true
    requires:
      vars: [NAME, SRC]
    vars:
      COMPONENT_PATH: "packages/components/{{.SRC}}"
      COMPONENT_NAME: "{{.NAME}}.wasm"
    cmds:
      - echo "Building component {{.COMPONENT_NAME}} at {{.COMPONENT_PATH}}"
      - rm -f "./target/wasm32-wasip1/release/{{.COMPONENT_NAME}}.*" || true
      - rm -f "{{.COMPONENTS_ARTIFACTS_PATH}}/{{.COMPONENT_NAME}}" || true
      - cd "{{.COMPONENT_PATH}}" && cargo build --release --target wasm32-wasip2
      - mkdir -p "{{.COMPONENTS_ARTIFACTS_PATH}}"
      - cp "./target/wasm32-wasip1/release/{{.COMPONENT_NAME}}" "{{.COMPONENTS_ARTIFACTS_PATH}}/{{.COMPONENT_NAME}}"

  bindings-component-inner:
    internal: true
    requires:
      vars: [SRC]
    vars:
      COMPONENT_PATH: "packages/components/{{.SRC}}"
    cmds:
      - echo "Generating bindings at {{.COMPONENT_PATH}}"
      - cd "{{.COMPONENT_PATH}}" && cargo component bindings

  exec-component-inner:
    internal: true
    requires:
      vars: [NAME]
    vars:
      COMPONENT_PATH: "packages/components/artifacts/{{.NAME}}.wasm"
      LOG_LEVEL: "{{.RUST_LOG}}"
    cmds:
      - echo "Executing component {{.COMPONENT_PATH}} with args of \"{{.CLI_ARGS}}\""
      - >
        {{.DOCKER_SUDO}} docker run --rm --network host
        -v "{{.REPO_ROOT}}":/repo
        -v "{{.WAVS_HOME_DIR}}":/wavs-home
        {{.WAVS_DOCKER_IMAGE}}
        wavs-cli exec --home /wavs-home --log-level {{.LOG_LEVEL}} --component "/repo/{{.COMPONENT_PATH}}" --input "{{.CLI_ARGS}}"

  ### WIT MANAGEMENT TASKS
  clean-wit:
    status:
      - test -d {{.WIT_DEFINITIONS_PATH}}
    cmds:
      - echo "Cleaning WIT in {{.WIT_DEFINITIONS_PATH}}"
      - rm -rf "{{.WIT_DEFINITIONS_PATH}}"

  fetch-wit:
    vars:
      SKIP_CLONE: "{{default false .SKIP_CLONE}}"
    cmds:
      - task: clone-wit-repo
        vars:
          SKIP_CLONE: "{{.SKIP_CLONE}}"
      - cd "{{.WIT_DEFINITIONS_PATH}}/operator" && wkg wit fetch
      - cd "{{.WIT_DEFINITIONS_PATH}}/aggregator" && wkg wit fetch

  clone-wit-repo:
    internal: true
    deps: [clean-wit]
    vars:
      SKIP_CLONE: "{{default false .SKIP_CLONE}}"
      BRANCH: "{{default .COMPONENT_WAVS_WIT_BRANCH .BRANCH}}"
    status:
      - "{{.SKIP_CLONE}}"
    cmds:
      - echo "Downloading WIT worlds from {{.BRANCH}} branch"
      - rm -rf "{{.TEMP_CLONE_PATH}}"
      - mkdir -p "{{.TEMP_CLONE_PATH}}"
      - rm -rf "{{.WIT_DEFINITIONS_PATH}}"
      - mkdir -p "{{.WIT_DEFINITIONS_PATH}}"
      - git -C "{{.TEMP_CLONE_PATH}}" clone --depth=1 --branch {{.BRANCH}} --single-branch https://github.com/Lay3rLabs/wavs-wasi.git
      - cp -R "{{.TEMP_CLONE_PATH}}"/wavs-wasi/wit-definitions/* "{{.WIT_DEFINITIONS_PATH}}/"
      - rm -rf "{{.TEMP_CLONE_PATH}}"
