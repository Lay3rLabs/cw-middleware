version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

vars:
  ALL_CONTRACT_KINDS: ["mock", "ecdsa", "bls"]

tasks:
  # Validate CONTRACT_BUILD_KIND env var before returning it
  env-build-kind:
    silent: true
    vars:
      CONTRACT_BUILD_KIND: '{{env "CONTRACT_BUILD_KIND"}}'
      VALID_KINDS_PATTERN: '{{range $i, $v := .ALL_CONTRACT_KINDS}}{{if $i}}|{{end}}"{{$v}}"{{end}}'
      VALID_KINDS_LIST: '{{range $i, $v := .ALL_CONTRACT_KINDS}}{{if $i}}, {{end}}{{$v}}{{end}}'
    cmds:
      - |
        if [ -z "{{.CONTRACT_BUILD_KIND}}" ]; then
          echo "❌ CONTRACT_BUILD_KIND environment variable is not set. Please set it in .env file." >&2
          exit 1
        fi
        
        case "{{.CONTRACT_BUILD_KIND}}" in
          {{.VALID_KINDS_PATTERN}})
            echo "{{.CONTRACT_BUILD_KIND}}"
            ;;
          *)
            echo "❌ CONTRACT_BUILD_KIND must be one of: {{.VALID_KINDS_LIST}}. Current value: {{.CONTRACT_BUILD_KIND}}" >&2
            exit 1
            ;;
        esac

  artifacts-path:
    vars:
      # If CONTRACT_BUILD_KIND is explicitly provided, use that, otherwise load from env
      CONTRACT_BUILD_KIND_DEFAULT:
        sh: task contract:env-build-kind
      CONTRACT_BUILD_KIND: "{{if .CONTRACT_BUILD_KIND}}{{.CONTRACT_BUILD_KIND}}{{else}}{{.CONTRACT_BUILD_KIND_DEFAULT}}{{end}}"
      CONTRACT_ARTIFACTS_PATH: '{{joinPath .REPO_ROOT "packages" "contracts" .CONTRACT_BUILD_KIND "artifacts"}}'
    cmds:
      - echo "{{.CONTRACT_ARTIFACTS_PATH}}"


  clean:
    cmds:
      - task: clean-inner
        vars:
          CONTRACT_BUILD_KIND:
            sh: task contract:env-build-kind

  clean-all:
    cmds:
      - for: { var: ALL_CONTRACT_KINDS }
        cmd: task contract:clean-inner CONTRACT_BUILD_KIND={{.ITEM}}

  clean-inner:
    requires:
      vars: [CONTRACT_BUILD_KIND]
    vars:
      CONTRACT_ARTIFACTS_PATH:
        sh: task contract:artifacts-path CONTRACT_BUILD_KIND={{.CONTRACT_BUILD_KIND}}
    cmds:
      - echo "Cleaning {{.CONTRACT_BUILD_KIND}} contracts" 
      - rm -rf "{{.CONTRACT_ARTIFACTS_PATH}}"

  build:
    cmds:
      - task: build-inner
        vars:
          CONTRACT_BUILD_KIND:
            sh: task contract:env-build-kind

  build-all:
    cmds:
      - for: { var: ALL_CONTRACT_KINDS }
        cmd: task contract:build-inner CONTRACT_BUILD_KIND={{.ITEM}}
  
  build-inner:
    requires:
      vars: [CONTRACT_BUILD_KIND]
    cmds:
      # Building in parallel seems to break things
      - task: build-service-handler
        vars: 
          CONTRACT_BUILD_KIND: "{{.CONTRACT_BUILD_KIND}}"
      - task: build-service-manager
        vars: 
          CONTRACT_BUILD_KIND: "{{.CONTRACT_BUILD_KIND}}"

  build-service-handler:
      - task: inner-build-contract
        vars:
          NAME: "service_handler"
          SRC: "service-handler"
          CONTRACT_BUILD_KIND: "{{.CONTRACT_BUILD_KIND}}"

  build-service-manager:
      - task: inner-build-contract
        vars:
          NAME: "service_manager"
          SRC: "service-manager"
          CONTRACT_BUILD_KIND: "{{.CONTRACT_BUILD_KIND}}"

  inner-build-contract:
    internal: true
    requires:
      vars: [NAME, SRC, CONTRACT_BUILD_KIND]
    vars:
      CONTRACT_ARTIFACTS_PATH:
        sh: task contract:artifacts-path CONTRACT_BUILD_KIND={{.CONTRACT_BUILD_KIND}}
      CONTRACT_PATH: "packages/contracts/{{.CONTRACT_BUILD_KIND}}/{{.SRC}}"
      CONTRACT_NAME: "{{.CONTRACT_BUILD_KIND}}_{{.NAME}}.wasm"
    cmds: 
      - echo "Building contract {{.CONTRACT_NAME}} at {{.CONTRACT_PATH}}"
      - |
        {{.DOCKER_SUDO}} rm -rf "./artifacts/{{.CONTRACT_NAME}}" || true
      - rm -f "{{.CONTRACT_ARTIFACTS_PATH}}/{{.CONTRACT_NAME}}" || true
      - >
        {{.DOCKER_SUDO}} docker run --rm
        -v "{{.REPO_ROOT}}:/code"
        --mount type=volume,source="layer_wavs_cache",target=/target
        --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry
        {{.COSMWASM_OPTIMIZER_IMAGE}} "{{.CONTRACT_PATH}}"
      - mkdir -p "{{.CONTRACT_ARTIFACTS_PATH}}"
      - cp -r "./artifacts/{{.CONTRACT_NAME}}" "{{.CONTRACT_ARTIFACTS_PATH}}/{{.CONTRACT_NAME}}"
      - |
        {{.DOCKER_SUDO}} rm -rf "./artifacts/{{.CONTRACT_NAME}}" || true
      - echo "Built contract at {{.CONTRACT_ARTIFACTS_PATH}}/{{.CONTRACT_NAME}}"
